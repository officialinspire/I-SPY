name: Android touch QA

# A dedicated gate for the thing a desktop browser cannot show: a real
# multitouch sequence, with each finger arriving on its own event the way
# Android delivers them, across LOCATE, COUNT and CHANGE.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-touch-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-touch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Run deterministic and source QA
        run: npm run validate

      - name: Build production bundle
        run: npm run build

      - name: Install browser QA runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/ispy-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ispy-preview.log
          exit 1

      # Under a virtual display: the gesture assertions are measured in
      # rendered frames, and a starved headless loop makes a working build
      # look like a broken one.
      - name: Stress Android pan and pinch in every gameplay mode
        env:
          ISPY_E2E_ONLY: android-chromium,android-change-chromium,small-android-chromium
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" node scripts/cross-device-e2e.mjs
