name: Cross-device QA

# The browser suite plays a real mission to its debrief on desktop, tablet,
# iPhone and Android profiles, so it guards the things the deterministic
# suites cannot see: layout, hit areas, input, and scene lifecycle under
# actual rendering. It runs on every pull request and on main, because a
# regression here reaches players through GitHub Pages.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read

concurrency:
  group: cross-device-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install app dependencies
        run: npm ci
      - name: Run deterministic and source QA
        run: npm run validate
      - name: Build production bundle
        run: npm run build
      - name: Install browser QA runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/ispy-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ispy-preview.log
          exit 1
      # Under a virtual display. Headless WebKit on this runner has been seen
      # rendering twenty-two animation frames in four minutes, which starves
      # the game of the steps every scene transition and input is processed
      # in, and makes a working build look like a broken one.
      - name: Cross-device browser QA
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" node scripts/cross-device-e2e.mjs
